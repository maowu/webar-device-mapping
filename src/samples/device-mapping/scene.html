<a-scene landing-page xrextras-loading xrextras-runtime-error xrweb device-mapping-session>
  <a-camera id="camera" position="0 8 0" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse"></a-camera>

  <a-light type="ambient" intensity="1"></a-light>
  <a-light type="directional" intensity="0.75" position="1 4.3 2.5"></a-light>

  <a-entity id="slam-origin">
    <a-sphere radius="0.08" color="#ffffff" position="0 0 0"></a-sphere>
    <a-cylinder radius="0.015" height="1" color="#ef4444" position="0.5 0 0" rotation="0 0 90"></a-cylinder>
    <a-cone radius-bottom="0.05" height="0.14" color="#ef4444" position="1.06 0 0" rotation="0 0 -90"></a-cone>
    <a-cylinder radius="0.015" height="1" color="#22c55e" position="0 0.5 0"></a-cylinder>
    <a-cone radius-bottom="0.05" height="0.14" color="#22c55e" position="0 1.06 0"></a-cone>
    <a-cylinder radius="0.015" height="1" color="#3b82f6" position="0 0 0.5" rotation="90 0 0"></a-cylinder>
    <a-cone radius-bottom="0.05" height="0.14" color="#3b82f6" position="0 0 1.06" rotation="90 0 0"></a-cone>
  </a-entity>

  <a-entity id="memory-root"></a-entity>
  <a-entity id="map-debug-root"></a-entity>
  <a-entity
    id="memory-ground"
    geometry="primitive: plane; height: 1000; width: 1000"
    rotation="-90 0 0"
    material="opacity: 0; transparent: true"
    class="cantap"></a-entity>
</a-scene>

<div id="dm-scan-assist" class="dm-scan-assist" hidden aria-live="polite">
  <div class="sca-count" id="sca-count"></div>
  <svg class="sca-radar" id="sca-radar" viewBox="0 0 186 186" aria-label="Scan coverage radar"></svg>
  <div class="sca-msg" id="sca-msg"></div>
  <div class="sca-sub" id="sca-sub"></div>
  <div class="sca-meter">
    <div class="sca-track"><div class="sca-fill" id="sca-fill"></div></div>
    <div class="sca-metertx"><span>Parallax</span><span id="sca-meter-tx"></span></div>
  </div>
  <div class="sca-chips" id="sca-chips"></div>
</div>

<div id="dm-align-guide" class="dm-align-guide" hidden aria-live="polite">
  <img id="dm-align-guide-img" class="dm-align-guide-img" alt="Reference view for alignment" />
  <div class="dm-align-guide-hint">Match this view to relocalize</div>
  <button id="dm-align-guide-dismiss" type="button" class="dm-align-guide-dismiss" aria-label="Dismiss alignment guide">✕</button>
</div>

<button id="dm-collapse-tab" class="dm-collapse-tab" type="button" aria-expanded="true" aria-controls="dm-panel">
  <span class="dm-collapse-dot" id="dm-collapse-dot"></span>
  <span class="dm-collapse-label">MAP</span>
  <svg class="dm-collapse-chevron" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
    <path d="M4 9 L12 16 L20 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<!-- Persistent slim toolbar: shown by default (option 1). Progressive disclosure
     (has-map/has-keyframes/is-scanning classes set by main.js) keeps it minimal
     when idle — only Scan + More — and reveals Place/Relocalize/Generate-code
     once a map exists. The MAP tab can still fully hide it for an unobstructed
     AR view. -->
<section class="dm-panel" id="dm-panel" aria-label="Device mapping controls">
  <div class="dm-ticks" aria-hidden="true"></div>

  <div class="dm-topline">
    <span class="dm-eyebrow" id="dm-eyebrow">▚ DEVICE MAP</span>
    <span id="dm-count" class="dm-count">0 keyframes</span>
    <button id="dm-role-toggle" class="dm-role-toggle" type="button" data-role="master">MASTER</button>
  </div>

  <div class="dm-readout">
    <div id="dm-status" class="dm-status">Scan a stable viewpoint first</div>
    <div id="dm-method" class="dm-method dm-method-idle"><span class="dm-method-dot"></span>IDLE</div>
  </div>

  <div class="dm-actions">
    <button id="dm-scan-toggle" type="button" class="dm-master-only" aria-label="Scan" title="Scan">
      <span class="dm-action-glyph">●</span><span class="dm-action-label">Scan</span>
    </button>
    <button id="dm-place" type="button" aria-label="Place" title="Place">
      <span class="dm-action-glyph">＋</span><span class="dm-action-label">Place</span>
    </button>
    <button id="dm-restore" type="button" aria-label="Relocalize" title="Relocalize">
      <span class="dm-action-glyph">⌖</span><span class="dm-action-label">Relocalize</span>
    </button>
  </div>

  <!-- MASTER: primary share flow, promoted out of the debug drawer for discoverability -->
  <div class="dm-hero dm-master-only">
    <span class="dm-group-label">Share map</span>
    <button id="dm-share-map" type="button" class="dm-hero-btn">
      <span class="dm-action-glyph">⇪</span><span class="dm-action-label">Generate code</span>
    </button>
    <div id="dm-share-result" class="dm-share-result" hidden>
      <span id="dm-share-code" class="dm-share-code"></span>
      <button id="dm-share-copy" type="button" class="dm-copy-btn">Copy</button>
    </div>
  </div>

  <!-- PEER: primary join flow, promoted out of the debug drawer for discoverability -->
  <div class="dm-hero dm-peer-only">
    <span class="dm-group-label">Join map</span>
    <div class="dm-join-row">
      <input id="dm-join-code" type="text" maxlength="6" placeholder="Enter code" class="dm-join-input" spellcheck="false" autocomplete="off" autocapitalize="none" autocorrect="off" />
      <button id="dm-join-map" type="button" class="dm-join-btn">Join</button>
    </div>
  </div>

  <button id="dm-debug-toggle" class="dm-debug-toggle" type="button" aria-expanded="false">
    <span>More</span>
    <svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true">
      <path d="M4 9 L12 16 L20 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div id="dm-debug" class="dm-debug">
    <div id="dm-results" class="dm-results"></div>

    <div class="dm-group dm-master-only">
      <span class="dm-group-label">Map</span>
      <div class="dm-secondary">
        <button id="dm-build-map" type="button">Rebuild map</button>
      </div>
    </div>

    <div class="dm-group">
      <span class="dm-group-label">Overlays</span>
      <div class="dm-pills">
        <label class="dm-pill">
          <input id="dm-feature-toggle" type="checkbox" />
          <span>ORB features</span>
        </label>
        <label class="dm-pill">
          <input id="dm-map-toggle" type="checkbox" />
          <span>Map points</span>
        </label>
        <label class="dm-pill">
          <input id="dm-live-map-toggle" type="checkbox" />
          <span>Live preview</span>
        </label>
      </div>
    </div>

    <div class="dm-group dm-master-only">
      <span class="dm-group-label">Export</span>
      <div class="dm-secondary">
        <button id="dm-export-map" type="button">Export file</button>
      </div>
    </div>

    <div class="dm-group">
      <span class="dm-group-label">Import</span>
      <div class="dm-secondary">
        <label for="dm-import-file" class="dm-file-label">Import file</label>
        <input id="dm-import-file" type="file" accept="application/json" class="dm-file-input" />
      </div>
    </div>

    <div class="dm-group">
      <span class="dm-group-label">Data</span>
      <div class="dm-secondary">
        <button id="dm-clear-objects" type="button">Clear objects</button>
        <button id="dm-export-log" type="button">Export log</button>
        <button id="dm-clear" type="button" class="dm-danger">Clear local data</button>
      </div>
    </div>
  </div>
</section>

<canvas id="dm-feature-overlay" class="dm-feature-overlay" aria-hidden="true"></canvas>

<div id="dm-modal-backdrop" class="dm-modal-backdrop" hidden>
  <div class="dm-modal" role="dialog" aria-modal="true" aria-labelledby="dm-modal-title">
    <div class="dm-modal-title" id="dm-modal-title"></div>
    <div class="dm-modal-sub" id="dm-modal-sub"></div>
    <div class="dm-modal-actions">
      <button id="dm-modal-cancel" type="button" class="dm-modal-btn dm-modal-btn-ghost"></button>
      <button id="dm-modal-confirm" type="button" class="dm-modal-btn dm-modal-btn-primary"></button>
    </div>
  </div>
</div>
